<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 45 440 395" width="100%" height="100%">
  <!-- Circular Emblem Only (No Text Inside Image) -->
  <g id="logo-mark" transform="translate(0, 10)">
    
    <!-- 1. LEFT NAVY GEAR SECTION (#0c2b54) -->
    <path d="M 300 55 A 185 185 0 0 0 115 240 A 185 185 0 0 0 135 320 L 180 300 A 140 140 0 0 1 160 240 A 140 140 0 0 1 300 100 Z" fill="#0c2b54"/>
          
    <!-- Gear Teeth along Arc -->
    <polygon points="215,90 228,52 262,64 250,102" fill="#0c2b54"/>
    <polygon points="148,155 120,132 142,104 172,126" fill="#0c2b54"/>
    <polygon points="120,222 80,222 80,258 120,258" fill="#0c2b54"/>
    <polygon points="142,322 116,346 138,372 165,348" fill="#0c2b54"/>

    <!-- 2. INNER WHITE CIRCLE BASE -->
    <circle cx="300" cy="240" r="142" fill="#ffffff"/>

    <!-- 3. TILTED SMARTPHONE (Vibrant Orange #f15a24 - Fully Visible) -->
    <g transform="rotate(26 300 240)">
      <rect x="212" y="92" width="176" height="296" rx="36" fill="#f15a24"/>
      <rect x="270" y="110" width="60" height="7" rx="3.5" fill="#ffffff" opacity="0.95"/>
      <rect x="226" y="128" width="148" height="224" rx="18" fill="#ffffff"/>
      <rect x="272" y="364" width="56" height="8" rx="4" fill="#ffffff" opacity="0.95"/>
    </g>

    <!-- 4. RIGHT OUTER ORANGE CIRCULAR ACCENT -->
    <path d="M 395 100 A 185 185 0 0 1 455 330 L 412 310 A 140 140 0 0 0 365 135 Z" fill="#f15a24"/>

    <!-- 5. PULSE WAVE FORMING THE STYLIZED 'M' -->
    <polyline points="105,240 215,240 234,256 256,182 284,260 312,182 334,256 352,240 485,240" 
      fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="4"/>
    <polyline points="105,240 215,240 234,256 256,182 284,260 312,182 334,256 352,240 485,240" 
      fill="none" stroke="#0c2b54" stroke-width="8" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="4"/>

  </g>
</svg>